<!DOCTYPE html>
<html>

<body style="padding:20px;font-family:sans-serif">

<p id="status">Inapakia...</p>
<input id="email" placeholder="Email" /><br><br>
<input id="pass" type="password" placeholder="Password" /><br><br>
<button onclick="signup()">Sign Up</button>
<button onclick="login()">Login</button>
<p id="msg" style="color:red"></p>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const URL = "https://fgocnybpjweezxwvycdt.supabase.co/rest/v1/";
const KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZnb2NueWJwandlZXp4d3Z5Y2R0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI4ODcyOTQsImV4cCI6MjEwODQ2MzI5NH0.mPeLgmZadGDw0MItQ0U-4FhzeeGrszMiddmXxf8Hhfo";
document.getElementById('status').innerText = "URL: " + URL.substring(0,20) + " | KEY imewekwa: " + (KEY.length > 20 ? "YES" : "NO - bado hujaiweka");
const supabase = window.supabase.createClient(URL, KEY);
async function signup(){
  document.getElementById('msg').innerText = "Inajaribu Sign Up...";
  const email = document.getElementById('email').value;
  const password = document.getElementById('pass').value;
  const { data, error } = await supabase.auth.signUp({ email, password });
  document.getElementById('msg').innerText = error ? "ERROR: " + error.message : 'OK - Check email';
}
async function login(){
  document.getElementById('msg').innerText = "Inajaribu Login...";
  const email = document.getElementById('email').value;
  const password = document.getElementById('pass').value;
  const { data, error } = await supabase.auth.signInWithPassword({ email, password });
  document.getElementById('msg').innerText = error ? "ERROR: " + error.message : 'OK - Logged in!';
}
</script>
</body>
