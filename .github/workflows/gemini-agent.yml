name: ZUKA Autonomous AI Agent
on:
  issue_comment:
    types: [created]
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  zuka-autonomous-dev:
    if: contains(github.event.issue.body, '@zuka-ai') || contains(github.event.comment.body, '@zuka-ai')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ZUKA repository
        uses: actions/checkout@v4

      - name: Install OpenCode AI Agent
        run: npm install -g opencode-ai

      - name: Run Verified OpenRouter Coding Agent
        env:
          OPENROUTER_API_KEY: ${{ secrets.ZUKA }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_BODY: ${{ github.event.comment.body || github.event.issue.body }}
        run: |
          git config user.name "ZUKA AI Agent"
          git config user.email "agent@zuka.app"
          BRANCH="ai-fix-${{ github.run_number }}"
          git checkout -b "$BRANCH"

          TASK="Complete this request cleanly: $ISSUE_BODY. Inspect the necessary files, make clean code edits across the project, run npm run build to confirm zero errors, and save changes."

          opencode run -m "openrouter/openrouter/free" "$TASK" || \
          opencode run -m "openrouter/qwen/qwen3-coder:free" "$TASK" || \
          opencode run -m "openrouter/deepseek/deepseek-r1:free" "$TASK"

          git add .
          if git diff --cached --quiet; then
            echo "No file changes were produced."
            exit 1
          fi
          git commit -m "ZUKA AI update #${{ github.run_number }}"
          git push -u origin "$BRANCH"
          gh pr create --title "ZUKA AI Update #${{ github.run_number }}" --body "Automated changes requested in issue." --base main
