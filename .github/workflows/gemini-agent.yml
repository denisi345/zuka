name: ZUKA Autonomous AI Agent
on:
  issue_comment:
    types: [created]
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  zuka-autonomous-dev:
    if: contains(github.event.issue.body, '@zuka-ai') || contains(github.event.comment.body, '@zuka-ai')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ZUKA repository
        uses: actions/checkout@v4

      - name: Install OpenCode AI Agent
        run: npm install -g opencode-ai

      - name: Run Verified OpenRouter Coding Agent
        env:
          OPENROUTER_API_KEY: ${{ secrets.ZUKA }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_BODY: ${{ github.event.comment.body || github.event.issue.body }}
        run: |
          git config user.name "ZUKA AI Agent"
          git config user.email "agent@zuka.app"
          BRANCH="ai-fix-${{ github.run_number }}"
          git checkout -b "$BRANCH"

          TASK="You are building ZUKA, a social network designed to look and work exactly like Facebook. User request: $ISSUE_BODY. Always ensure Facebook-style UI/UX, connect all features to Supabase tables, never use hardcoded personal names (use generic labels like ZUKA Member), make clean code edits across the necessary files, and run npm run build to confirm zero errors."

          opencode run -m "openrouter/openrouter/free" "$TASK" || \
          opencode run -m "openrouter/qwen/qwen3-coder:free" "$TASK" || \
          opencode run -m "openrouter/deepseek/deepseek-r1:free" "$TASK"

          git add .
          if git diff --cached --quiet; then
            gh issue comment "${{ github.event.issue.number }}" --body "ZUKA AI Agent checked the repository and verified that the build passes cleanly."
            exit 0
          fi
          git commit -m "ZUKA Facebook-style AI update #${{ github.run_number }}"
          git push -u origin "$BRANCH"
          gh pr create --title "ZUKA AI Update #${{ github.run_number }}" --body "Automated Facebook-style updates requested in issue." --base main
