name: ZUKA Forever-Free AI Agent
on:
  issue_comment:
    types: [created]
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  zuka-autonomous-dev:
    if: contains(github.event.issue.body, '@zuka-ai') || contains(github.event.comment.body, '@zuka-ai')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ZUKA repository
        uses: actions/checkout@v4

      - name: Install OpenCode AI Agent
        run: npm install -g opencode-ai

      - name: Run OpenRouter Free Coding Agent
        env:
          OPENROUTER_API_KEY: ${{ secrets.ZUKA }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "ZUKA AI Agent"
          git config user.email "agent@zuka.app"
          git checkout -b ai-fix-${{ github.run_number }}
          opencode run --model openrouter/free "Read the user's request, inspect ONLY the necessary files in this repo, make clean edits to complete the task, run npm run build to verify zero errors, and save your edits. Request: ${{ github.event.comment.body || github.event.issue.body }}"
          git add .
          git commit -m "AI update for ZUKA" || exit 0
          git push -u origin ai-fix-${{ github.run_number }}
          gh pr create --title "ZUKA AI Update #${{ github.run_number }}" --body "Automated changes requested in issue." --base main
