name: ZUKA Autonomous AI Agent
on:
  issue_comment:
    types: [created]
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  zuka-autonomous-dev:
    if: contains(github.event.issue.body, '@zuka-ai') || contains(github.event.comment.body, '@zuka-ai')
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout ZUKA repository
        uses: actions/checkout@v4

      - name: Install OpenCode AI Agent
        run: npm install -g opencode-ai

      - name: Run Autonomous Coding Agent
        env:
          OPENROUTER_API_KEY: ${{ secrets.ZUKA }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_BODY: ${{ github.event.comment.body || github.event.issue.body }}
        run: |
          git config user.name "ZUKA AI Agent"
          git config user.email "agent@zuka.app"
          BRANCH="ai-fix-${{ github.run_number }}"
          git checkout -b "$BRANCH"

          TASK="You are building ZUKA, a social network designed to look and work like Facebook. Complete this request thoroughly: $ISSUE_BODY. Never use hardcoded personal names (use generic labels like ZUKA Member), run npm run build to confirm zero errors, and finish cleanly."

          opencode run -m "openrouter/openrouter/free" "$TASK" || true

          git add .
          if git diff --cached --quiet; then
            gh issue comment "${{ github.event.issue.number }}" --body "ZUKA AI Agent completed check with no pending file changes."
            exit 0
          fi
          git commit -m "ZUKA AI update #${{ github.run_number }}"
          git push -u origin "$BRANCH"
          gh pr create --title "ZUKA AI Update #${{ github.run_number }}" --body "Automated Facebook-style update." --base main
