name: ZUKA Autonomous AI Agent
on:
  issue_comment:
    types: [created]
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  zuka-autonomous-dev:
    if: contains(github.event.issue.body, '@zuka-ai') || contains(github.event.comment.body, '@zuka-ai')
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Checkout ZUKA repository
        uses: actions/checkout@v4

      - name: Install OpenCode AI Agent
        run: npm install -g opencode-ai

      - name: Run High-Speed Coding Agent
        env:
          OPENROUTER_API_KEY: ${{ secrets.ZUKA }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_BODY: ${{ github.event.comment.body || github.event.issue.body }}
        run: |
          git config user.name "ZUKA AI Agent"
          git config user.email "agent@zuka.app"
          BRANCH="ai-fix-${{ github.run_number }}"
          git checkout -b "$BRANCH"

          TASK="You MUST edit the files directly to fulfill this ZUKA Facebook-style request: $ISSUE_BODY. Never use hardcoded personal names, run npm run build once, and finish."

          timeout 300 opencode run -m "openrouter/openrouter/free" "$TASK"

          git add .
          if git diff --cached --quiet; then
            gh issue comment "${{ github.event.issue.number }}" --body "ZUKA AI Agent checked the files and verified the build."
            exit 0
          fi
          git commit -m "ZUKA Phase 1 AI update #${{ github.run_number }}"
          git push -u origin "$BRANCH"
          gh pr create --title "ZUKA AI Update #${{ github.run_number }}" --body "Automated Phase 1 Facebook-style update." --base main
