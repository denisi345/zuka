<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZUKA</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{background:#000;color:#fff;font-family:system-ui;margin:0}
header{padding:14px;background:#111;text-align:center}
#app{max-width:600px;margin:0 auto;padding:12px}
.post{background:#161616;margin:14px 0;padding:14px;border-radius:12px}
button{border:0;padding:7px 12px;border-radius:20px;background:#fff;color:#000;margin:2px;cursor:pointer}
input,textarea{width:100%;padding:10px;margin:6px 0;border-radius:8px;background:#222;color:#fff;border:0}
img,video{max-width:100%;border-radius:10px}
</style>
</head>
<body>
<header><h1>ZUKA</h1></header>
<div id="app">
<textarea id="content" placeholder="What's on your mind?"></textarea>
<input type="file" id="file" accept="image/*,video/*">
<input id="search" placeholder="Search posts" oninput="loadPosts()">
<button onclick="createPost()">Post</button>
<div id="posts">Loading...</div>
</div>

<script>
const SUPABASE_URL = "https://fgocnybpjweezxwvycdt.supabase.co"
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZnb2NueWJwandlZXp4d3Z5Y2R0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI4ODcyOTQsImV4cCI6MjEwODQ2MzI5NH0.mPeLgmZadGDw0MItQ0U-4FhzeeGrszMiddmXxf8Hhfo"
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)

async function loadPosts(){
 const q=document.getElementById('search').value
 let query=supabase.from('posts').select('*').order('created_at',{ascending:false})
 if(q) query=query.ilike('content','%'+q+'%')
 const {data}=await query
 const el=document.getElementById('posts')
 if(!data||data.length===0){el.innerHTML="No posts";return}
 el.innerHTML=data.map(p=>`<div class="post"><p>${p.content||''}</p>${p.image_url?`<img src="${p.image_url}">`:''}<br><button onclick="like('${p.id}')">Like</button><button onclick="comment('${p.id}')">Comment</button><button onclick="share('${p.id}')">Share</button><button onclick="savePost('${p.id}')">Save</button><button onclick="report('${p.id}')">Report</button><button onclick="follow('${p.id}')">Follow</button><button onclick="block('${p.id}')">Block</button><button onclick="remove('${p.id}')">Delete</button><div id="c-${p.id}"></div></div>`).join('')
 data.forEach(p=>loadComments(p.id))
}

async function createPost(){
 const content=document.getElementById('content').value
 const file=document.getElementById('file').files[0]
 let image_url=null
 if(file){
  if(file.size>50*1024*1024){alert("File too large");return}
  const name=Date.now()+"_"+file.name
  const {error}=await supabase.storage.from('posts').upload(name,file)
  if(!error){const {data}=supabase.storage.from('posts').getPublicUrl(name);image_url=data.publicUrl}
 }
 await supabase.from('posts').insert({content,image_url})
 document.getElementById('content').value=""
 loadPosts()
}

async function like(id){await supabase.from('likes').insert({post_id:id})}
async function comment(id){const t=prompt("Comment"); if(t){await supabase.from('comments').insert({post_id:id,content:t}); loadComments(id)}}
async function loadComments(id){const {data}=await supabase.from('comments').select('*').eq('post_id',id); const el=document.getElementById('c-'+id); if(el&&data) el.innerHTML=data.map(c=>`<small>${c.content}</small><br>`).join('')}
function share(id){navigator.clipboard.writeText(location.href); new Notification("ZUKA Link copied")}
async function savePost(id){await supabase.from('saved').insert({post_id:id}); alert("Saved")}
async function report(id){await supabase.from('reports').insert({post_id:id}); alert("Reported")}
async function follow(id){await supabase.from('follows').insert({post_id:id}); alert("Followed")}
async function block(id){await supabase.from('blocks').insert({post_id:id}); alert("Blocked")}
async function remove(id){await supabase.from('posts').delete().eq('id',id); loadPosts()}

if(Notification.permission!=="granted") Notification.requestPermission()

loadPosts()
</script>
</body>
</html>
