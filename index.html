<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZUKA</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}
body{background:#f0f2f5}
header{background:#1877f2;color:white;padding:15px;text-align:center;font-weight:bold;font-size:22px;position:sticky;top:0}
.container{max-width:600px;margin:15px auto;padding:10px}
.box{background:white;padding:15px;border-radius:12px;margin-bottom:15px;box-shadow:0 1px 2px rgba(0,0,0,0.1)}
.box textarea{width:100%;border:none;background:#f0f2f5;padding:12px;border-radius:20px;outline:none;resize:none;font-size:16px}
.box button{background:#1877f2;color:white;border:none;padding:12px;border-radius:20px;width:100%;margin-top:10px;font-weight:bold;cursor:pointer}
.post{background:white;padding:15px;border-radius:10px;margin-bottom:10px;box-shadow:0 1px 2px rgba(0,0,0,0.1)}
#status{text-align:center;color:gray;padding:10px;font-size:14px}
</style>
</head>
<body>
<header>ZUKA</header>
<p id="status">Connecting...</p>
<div class="container">
<div class="box">
<textarea id="input" rows="3" placeholder="What's on your mind?"></textarea>
<button id="btn">Post</button>
</div>
<div id="feed"></div>
</div>
<script type="module">
import { createClient } from SUPABASE_URL = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const supabase = createClient( SUPABASE_ANON_KEY = 'https://fgocnybpjweezxwvycdt.supabase.co','eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZnb2NueWJwandlZXp4d3Z5Y2R0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI4ODcyOTQsImV4cCI6MjEwODQ2MzI5NH0.mPeLgmZadGDw0MItQ0U-4FhzeeGrszMiddmXxf8Hhfo');
const status=document.getElementById('status');
const feed=document.getElementById('feed');
const input=document.getElementById('input');
const btn=document.getElementById('btn');
async function load(){
 const {data,error}=await supabase.from('posts').select('*').order('created_at',{ascending:false});
 if(error){status.textContent=error.message;return;}
 status.textContent='Live';
 feed.innerHTML='';
 data.forEach(p=>{
  feed.innerHTML+=`<div class="post">${p.content}</div>`;
 });
}
btn.onclick=async()=>{
 if(!input.value.trim())return;
 btn.textContent='Posting...';
 const {error}=await supabase.from('posts').insert([{content:input.value}]);
 if(error){alert(error.message);btn.textContent='Post';return;}
 input.value='';
 load();
 btn.textContent='Post';
};
load();
</script>
</body>
</html>
